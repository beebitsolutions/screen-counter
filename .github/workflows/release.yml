name: Release

on:
  push:
    branches:
      - release

# Required for OIDC provenance and for changesets/action to open release PRs.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # License guard: refuse to publish while the package is UNLICENSED.
      # Build and test still run so any regressions surface; only the
      # Create-Release-PR-or-Publish step is skipped.
      - name: License guard
        run: |
          LICENSE_FIELD=$(node -p "require('./packages/screen-counter/package.json').license")
          if [ "$LICENSE_FIELD" = "UNLICENSED" ]; then
            echo "::warning::Package license is still UNLICENSED. Skipping publish step. See documentation/guides/03-publicacion-npm.md step 3."
            echo "SKIP_PUBLISH=1" >> $GITHUB_ENV
          fi

      # Diagnostic — prints the npm user the NPM_TOKEN authenticates as
      # plus the token's permissions on the @beebit scope. Useful to debug
      # 404 / 403 errors during publish. Safe to keep long-term: prints
      # user metadata only, never the token.
      #
      # NOTE: setup-node@v4 writes its own .npmrc and forces npm to read
      # it via NPM_CONFIG_USERCONFIG. That file expects NODE_AUTH_TOKEN
      # (not NPM_TOKEN) for the registry token. So every step that calls
      # npm directly needs NODE_AUTH_TOKEN set, even if our secret is
      # called NPM_TOKEN.
      - name: Diagnostic — npm auth status
        if: env.SKIP_PUBLISH != '1'
        run: |
          echo "::group::npm whoami"
          npm whoami || echo "whoami failed"
          echo "::endgroup::"
          echo "::group::npm token whoami via API"
          curl -sS -H "Authorization: Bearer ${NPM_TOKEN}" \
            https://registry.npmjs.org/-/whoami | head -c 500
          echo ""
          echo "::endgroup::"
          echo "::group::package access — who can publish @beebit/screen-counter"
          npm access list collaborators @beebit/screen-counter 2>&1 | head -20 || true
          echo "::endgroup::"
          echo "::group::package access — 2FA setting"
          npm access get status @beebit/screen-counter 2>&1 | head -20 || true
          echo "::endgroup::"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release PR or Publish
        if: env.SKIP_PUBLISH != '1'
        id: changesets
        uses: changesets/action@v1
        with:
          # Use `pnpm run <script>` explicitly. `pnpm version` and `pnpm release`
          # (without `run`) hit pnpm's builtins instead of the package.json
          # scripts, which makes the version step a silent no-op and the
          # release step misbehave.
          publish: pnpm run release
          version: pnpm run version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's .npmrc uses ${NODE_AUTH_TOKEN}. Without this env
          # the placeholder never expands and `npm publish` runs without
          # any usable auth, giving E404 (npm's misleading way of saying
          # "this token has no rights to publish here").
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance stays disabled until we move to npm Trusted
          # Publishing (OIDC). Re-enable after that.
          # NPM_CONFIG_PROVENANCE: "true"
